[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.35"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 512

[lint]
exclude_lints = ["screaming-snake-case-immutable", "mixed-case-variable", "mixed-case-function", "unwrapped-modifier-logic"]

[fmt]
line_length = 120
